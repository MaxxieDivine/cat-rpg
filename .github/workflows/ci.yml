name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          tools/setup_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Import
        run: godot --headless --path . --import || true
      - name: Validate dialogue
        run: godot --headless --path . --script res://tools/validate_dialogue.gd
      - name: Run tests (headless)
        run: tools/run_tests.sh godot
      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1 libgl1-mesa-dri
      - name: Run tests with a renderer (pixel checks, screenshots)
        run: xvfb-run -a tools/run_tests.sh godot -- --shots="$PWD/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + web templates
        run: |
          tools/setup_godot.sh --web
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build web
        run: tools/build_web.sh godot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
